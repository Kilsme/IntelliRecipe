langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${API-KEY}
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${API-KEY}
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${API-KEY}
      model-name: text-embedding-v4
      log-requests: true
      log-responses: true
      max-segments-per-batch: 10
    image-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      generations-url: https://dashscope.aliyuncs.com/compatible-mode/v1/images/generations
      dashscope-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis
      dashscope-task-url-template: https://dashscope.aliyuncs.com/api/v1/tasks/%s
      api-key: ${API-KEY}
      model-name: qwen-image-2.0
      log-requests: true
      log-responses: true
  community:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    dev.langchain4j: debug
spring:
  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_kitchen_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: root
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8082

image:
  generation:
    max-attempts: 3
    dashscope-model: wanx2.1-t2i-turbo
    enable-openai-compatible: false
    max-polls: 10
    poll-interval-ms: 1500
  storage-dir: ${user.dir}/data/recipe-images
  fallback:
    pollinations-enabled: false
    placeholder-url: /recipe-images/default-dish.svg

security:
  rate-limit:
    window-seconds: 60
    max-requests-per-window: 30
    login-max-requests: 8
    register-max-requests: 6
    session-max-requests: 40
    logout-max-requests: 20
